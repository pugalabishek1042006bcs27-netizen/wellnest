spring.application.name=WellNest

# Server Configuration
server.port=${PORT:8080}

# Frontend Configuration
frontend.url=${FRONTEND_URL:https://wellnest-zf4e.vercel.app}

# JWT Configuration
jwt.secret=${JWT_SECRET:wellnest-secret-key-for-jwt-authentication-should-be-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Sender email shown in email headers (verified in Brevo dashboard)
spring.mail.username=${SPRING_MAIL_USERNAME:wellnest@example.com}

# Gemini API
gemini.api.key=${GEMINI_API_KEY}
